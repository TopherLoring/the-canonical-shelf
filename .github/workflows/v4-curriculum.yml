name: application verification

on:
  push:
    branches:
      - main
      - 'fix/**'
      - curriculum-v4-redesign
      - v5-application-experience
      - v5-complete-experience
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/v4-curriculum.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify full application and curriculum
        run: bun run test
