name: v4 curriculum verification
on:
  push:
    branches: [curriculum-v4-redesign]
  pull_request:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/foundations*.js'
      - 'public/v4-*'
      - 'public/topics*'
      - 'public/sw.js'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/v4-curriculum.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Verify full application and v4 curriculum
        run: npm test
