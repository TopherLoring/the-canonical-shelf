<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Canonical Shelf v4 Integrated Preview</title>
<link rel="stylesheet" href="foundations.css"><link rel="stylesheet" href="v4-design-system.css"><link rel="stylesheet" href="v4-integrated.css">
<style>body{margin:0;background:var(--paper,#e6e7e2);color:var(--ink,#1b1d22);font-family:var(--sans,system-ui);line-height:1.55}.pv-nav{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--rule);background:color-mix(in srgb,var(--paper) 93%,transparent);backdrop-filter:blur(10px)}.pv-nav>div{max-width:1160px;margin:auto;padding:10px 18px;display:flex;gap:8px;align-items:center}.pv-brand{font-family:var(--serif);font-weight:700;font-size:18px;margin-right:auto}.pv-nav button{border:1px solid var(--rule);border-radius:999px;padding:9px 14px;background:transparent;cursor:pointer}.pv-nav button[aria-pressed="true"]{background:var(--ink);color:var(--paper-3)}.pv-main{max-width:1180px;margin:auto;padding:28px 18px 90px}.pv-pane[hidden]{display:none}</style>
</head><body>
<nav class="pv-nav"><div><span class="pv-brand">The Canonical Shelf · v4</span><button data-pv="course" aria-pressed="true">Course</button><button data-pv="topics" aria-pressed="false">Topics</button></div></nav>
<main class="pv-main"><section id="pv-course" class="pv-pane"></section><section id="pv-topics" class="pv-pane" hidden></section></main>
<!-- Build the complete 70-lesson source data without initializing the legacy renderer. -->
<script src="foundations-data.js"></script><script src="foundations-expansion-core.js"></script><script src="foundations-units-02-08.js"></script><script src="foundations-units-09-16.js"></script>
<script src="v4-course-map.js"></script><script src="v4-guided-visual-rules.js"></script><script src="v4-curriculum-migration.js"></script>
<script src="v4-visuals.js"></script><script src="v4-games.js"></script><script src="v4-guided-game-adapter.js"></script><script src="v4-guided-shell.js"></script><script src="v4-progress-migration.js"></script>
<script src="v4-mastery-content.js"></script><script src="v4-mastery-story.js"></script><script src="v4-mastery-order.js"></script><script src="v4-mastery-groups.js"></script><script src="v4-mastery-chrono.js"></script><script src="v4-mastery-content-profiles.js"></script><script src="v4-mastery-themes.js"></script><script src="v4-mastery-verses.js"></script><script src="v4-mastery-manifest.js"></script>
<script src="topics-data.js"></script><script src="topics-extended.js"></script><script src="v4-topic-bridge.js"></script><script src="topics.js"></script>
<script src="v4-app-integrated.js"></script>
<script>
CanonV4Integrated.mount('#pv-course');if(window.CanonTopics?.mount)CanonTopics.mount(document.querySelector('#pv-topics'));
document.querySelectorAll('[data-pv]').forEach(b=>b.addEventListener('click',()=>{const p=b.dataset.pv;document.querySelectorAll('[data-pv]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#pv-course').hidden=p!=='course';document.querySelector('#pv-topics').hidden=p!=='topics';if(p==='topics'&&window.CanonTopics?.mount)CanonTopics.mount(document.querySelector('#pv-topics'));window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}));
</script></body></html>
