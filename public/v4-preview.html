<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Canonical Shelf v4 Preview</title>
<link rel="stylesheet" href="foundations.css">
<link rel="stylesheet" href="v4-design-system.css">
<style>
body{margin:0;background:var(--paper,#e6e7e2);color:var(--ink,#1b1d22);font-family:var(--sans,system-ui);line-height:1.55}.v4-preview-nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper,#e6e7e2) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--rule,rgba(0,0,0,.18))}.v4-preview-nav>div{max-width:1120px;margin:auto;padding:10px 18px;display:flex;gap:8px;align-items:center}.v4-preview-brand{font-family:var(--serif,Georgia);font-size:18px;font-weight:700;margin-right:auto}.v4-preview-main{max-width:1160px;margin:auto;padding:28px 18px 80px}.v4-preview-pane[hidden]{display:none}.v4-preview-nav button{border:1px solid var(--rule);border-radius:999px;background:transparent;padding:9px 13px;cursor:pointer}.v4-preview-nav button[aria-pressed="true"]{background:var(--ink);color:var(--paper-3,#fff)}
</style>
</head>
<body>
<nav class="v4-preview-nav"><div><span class="v4-preview-brand">The Canonical Shelf · v4 preview</span><button type="button" data-pane="course" aria-pressed="true">Course</button><button type="button" data-pane="topics" aria-pressed="false">Topics</button></div></nav>
<main class="v4-preview-main"><section id="preview-course" class="v4-preview-pane"></section><section id="preview-topics" class="v4-preview-pane" hidden></section></main>
<script src="v4-course-map.js"></script>
<script src="v4-course-map-fixed.js"></script>
<script src="v4-visuals.js"></script>
<script src="v4-games.js"></script>
<script src="v4-guided-game-adapter.js"></script>
<script src="v4-mastery-content.js"></script>
<script src="v4-mastery-story.js"></script>
<script src="v4-mastery-order.js"></script>
<script src="v4-mastery-groups.js"></script>
<script src="v4-mastery-chrono.js"></script>
<script src="v4-mastery-content-profiles.js"></script>
<script src="v4-mastery-themes.js"></script>
<script src="v4-mastery-verses.js"></script>
<script src="v4-mastery-manifest.js"></script>
<script src="v4-progress-migration.js"></script>
<script src="topics-data.js"></script>
<script src="v4-topic-bridge.js"></script>
<script src="topics.js"></script>
<script src="v4-app.js"></script>
<script>
CanonV4.mount('#preview-course');
if(window.CanonTopics?.mount)CanonTopics.mount(document.querySelector('#preview-topics'));
document.querySelectorAll('[data-pane]').forEach(b=>b.addEventListener('click',()=>{const pane=b.dataset.pane;document.querySelectorAll('[data-pane]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#preview-course').hidden=pane!=='course';document.querySelector('#preview-topics').hidden=pane!=='topics';if(pane==='topics'&&window.CanonTopics?.mount)CanonTopics.mount(document.querySelector('#preview-topics'));window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}));
</script>
</body>
</html>
